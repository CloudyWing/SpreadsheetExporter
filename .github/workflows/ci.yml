name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    uses: CloudyWing/devops-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      solution: SpreadsheetExporter.slnx
      dotnet-version: |
        8.0.x
        10.0.x
      pack: true
